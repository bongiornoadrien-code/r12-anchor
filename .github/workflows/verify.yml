name: R12 Verify
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: RUSTFLAGS="-D warnings" cargo check
      - name: Test
        run: RUSTFLAGS="-D warnings" cargo test
